name: ${COMPOSE_PROJECT_NAME:-zarrar}

services:
  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      zarrar:
        condition: service_healthy
    environment:
      ZARRAR_DOMAIN: ${ZARRAR_DOMAIN:?set the public DNS name}
      ACME_EMAIL: ${ACME_EMAIL:?set the ACME contact address}
      ZARRAR_PROXY_BODY_LIMIT: ${ZARRAR_PROXY_BODY_LIMIT:-512MB}
    ports:
      - "${ZARRAR_HTTP_PORT:-80}:80"
      - "${ZARRAR_HTTPS_PORT:-443}:443"
      - "${ZARRAR_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: ${ZARRAR_PROXY_IP:-172.30.0.10}
    user: "65532:65532"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cpus: ${CADDY_CPUS:-0.50}
    mem_limit: ${CADDY_MEMORY:-256m}
    pids_limit: 128
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

  zarrar:
    image: ${ZARRAR_IMAGE:-zarrar:production}
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ZARRAR_PUBLIC_URL: ${ZARRAR_PUBLIC_URL:?set the canonical https origin}
      ZARRAR_ALLOWED_HOSTS: ${ZARRAR_ALLOWED_HOSTS:?set exact public host names}
      ZARRAR_XOR_KEY: ${ZARRAR_XOR_KEY:?set a high-entropy root secret}
      ZARRAR_DYNAMIC_FLAG_HMAC_KEY: ${ZARRAR_DYNAMIC_FLAG_HMAC_KEY:?set an independent dynamic flag HMAC secret}
      ZARRAR_SHARED_GATEWAY_SIGNING_KEY: ${ZARRAR_SHARED_GATEWAY_SIGNING_KEY:?set an independent shared gateway signing secret}
      ZARRAR_SHARED_GATEWAY_ALLOWED_ORIGIN: ${ZARRAR_SHARED_GATEWAY_ALLOWED_ORIGIN:-}
      ZARRAR_VARIANT_SEED_KEY: ${ZARRAR_VARIANT_SEED_KEY:?set an independent deterministic variant seed secret}
      ZARRAR_VARIANT_BUILDER_ENABLED: ${ZARRAR_VARIANT_BUILDER_ENABLED:-false}
      ZARRAR_VARIANT_BUILDER_ORIGIN: ${ZARRAR_VARIANT_BUILDER_ORIGIN:-}
      ZARRAR_VARIANT_BUILDER_TOKEN: ${ZARRAR_VARIANT_BUILDER_TOKEN:-}
      ZARRAR_VARIANT_BUILDER_PARALLELISM: ${ZARRAR_VARIANT_BUILDER_PARALLELISM:-2}
      ZARRAR_VARIANT_MAX_ARTIFACT_BYTES: ${ZARRAR_VARIANT_MAX_ARTIFACT_BYTES:-67108864}
      ZARRAR_BOOTSTRAP_ADMIN_PASSWORD: ${ZARRAR_BOOTSTRAP_ADMIN_PASSWORD:-}
      ZARRAR_PROXY_IP: ${ZARRAR_PROXY_IP:-172.30.0.10}
      ZARRAR_MAX_REQUEST_BODY_BYTES: ${ZARRAR_MAX_REQUEST_BODY_BYTES:-536870912}
      ZARRAR_REQUEST_LOGGING: ${ZARRAR_REQUEST_LOGGING:-false}
      ZARRAR_ENABLE_TRAFFIC_CAPTURE: ${ZARRAR_ENABLE_TRAFFIC_CAPTURE:-false}
      ZARRAR_CONTAINER_PORT_MAPPING: ${ZARRAR_CONTAINER_PORT_MAPPING:-PlatformProxy}
      ZARRAR_CONTAINER_PUBLIC_ENTRY: ${ZARRAR_CONTAINER_PUBLIC_ENTRY:-}
      ZARRAR_RUNTIME_PROVIDER: ${ZARRAR_RUNTIME_PROVIDER:-Docker}
      ZARRAR_RUNTIME_MAX_INSTANCES: ${ZARRAR_RUNTIME_MAX_INSTANCES:-0}
      ZARRAR_MICROVM_ORIGIN: ${ZARRAR_MICROVM_ORIGIN:-}
      ZARRAR_MICROVM_TOKEN: ${ZARRAR_MICROVM_TOKEN:-}
      ZARRAR_MICROVM_NODE: ${ZARRAR_MICROVM_NODE:-microvm-primary}
      ZARRAR_MICROVM_HEALTH_PATH: ${ZARRAR_MICROVM_HEALTH_PATH:-v1/health}
      ZARRAR_MICROVM_TIMEOUT_SECONDS: ${ZARRAR_MICROVM_TIMEOUT_SECONDS:-30}
      ZARRAR_CHALLENGE_NETWORK_PREFIX: ${ZARRAR_CHALLENGE_NETWORK_PREFIX:-zarrar}
      ZARRAR_CHALLENGE_PIDS_LIMIT: ${ZARRAR_CHALLENGE_PIDS_LIMIT:-512}
      POSTGRES_DB: ${POSTGRES_DB:?set the PostgreSQL database}
      POSTGRES_USER: ${POSTGRES_USER:?set the PostgreSQL user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong PostgreSQL password}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set a strong Redis password}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set a bucket-scoped MinIO access key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set a strong bucket-scoped MinIO secret}
      MINIO_BUCKET: ${MINIO_BUCKET:?set the ZARRAR object bucket}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER_ADDRESS: ${SMTP_SENDER_ADDRESS:-}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-ZARRAR}
      ZARRAR_REQUIRE_SMTP: ${ZARRAR_REQUIRE_SMTP:-false}
      SMTP_TLS_BYPASS: "false"
    group_add:
      - "${DOCKER_GID:-65534}"
    volumes:
      - zarrar_files:/app/files
      - ${ZARRAR_RUNTIME_SOCKET_SOURCE:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      edge:
        ipv4_address: ${ZARRAR_APP_EDGE_IP:-172.30.0.20}
      data: {}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cpus: ${ZARRAR_APP_CPUS:-2.0}
    mem_limit: ${ZARRAR_APP_MEMORY:-2g}
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider --header=Host:$$ZARRAR_ALLOWED_HOSTS http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 8

  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set the PostgreSQL database}
      POSTGRES_USER: ${POSTGRES_USER:?set the PostgreSQL user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong PostgreSQL password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    shm_size: 256m
    cpus: ${POSTGRES_CPUS:-2.0}
    mem_limit: ${POSTGRES_MEMORY:-2g}
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2.8-alpine
    restart: unless-stopped
    user: "999:1000"
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set a strong Redis password}
    volumes:
      - redis_data:/data
    networks:
      - data
    cpus: ${REDIS_CPUS:-0.75}
    mem_limit: ${REDIS_MEMORY:-512m}
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ${ZARRAR_MINIO_IMAGE:-zarrar-minio:7aac2a2}
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set a non-default MinIO root user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set a strong MinIO password}
    volumes:
      - minio_data:/data
    networks:
      - data
    cpus: ${MINIO_CPUS:-1.0}
    mem_limit: ${MINIO_MEMORY:-1g}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: ${ZARRAR_MC_IMAGE:-zarrar-minio-client:77f82e1}
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/zarrar/minio-init.sh"]
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set a non-default MinIO root user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set a strong MinIO root password}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set a bucket-scoped MinIO access key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set a strong bucket-scoped MinIO secret}
      MINIO_BUCKET: ${MINIO_BUCKET:?set the ZARRAR object bucket}
    volumes:
      - ./minio-init.sh:/opt/zarrar/minio-init.sh:ro
    networks:
      - data
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${ZARRAR_EDGE_SUBNET:-172.30.0.0/24}
  data:
    driver: bridge
    internal: true

volumes:
  zarrar_files:
    name: ${ZARRAR_VOLUME_PREFIX:-zarrar}_files
  postgres_data:
    name: ${ZARRAR_VOLUME_PREFIX:-zarrar}_postgres
  redis_data:
    name: ${ZARRAR_VOLUME_PREFIX:-zarrar}_redis
  minio_data:
    name: ${ZARRAR_VOLUME_PREFIX:-zarrar}_minio
  caddy_data:
    name: ${ZARRAR_VOLUME_PREFIX:-zarrar}_caddy_data
  caddy_config:
    name: ${ZARRAR_VOLUME_PREFIX:-zarrar}_caddy_config
